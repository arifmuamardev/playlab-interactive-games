name: Test, Build and Deploy PlayLab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playlab-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run source-level regression checks
        run: npm test
      - name: Build from source
        run: npm run build
      - name: Verify static output
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -d dist/assets
      - name: Upload verified site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: playlab-verified-site
          path: dist/
          include-hidden-files: true

  browser:
    name: Browser regression (host, projector, responsive)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build release for browser tests
        run: npm run build
      - name: Run browser regressions
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy verified site to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [verify, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download verified site
        uses: actions/download-artifact@v4
        with:
          name: playlab-verified-site
          path: dist/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
